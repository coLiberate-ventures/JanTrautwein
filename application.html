<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apply to work with Jan Trautwein</title>
  <meta name="description" content="A short application for coaching with Jan Trautwein.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#19302a;--paper:#e5f0e8;--card:#f4f8f4;--muted:#59746c;--line:#b8cec1;--sun:#fab700;--max:740px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Manrope,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:url('images/paper-bg.jpg');background-size:600px}nav,main{position:relative}nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%}nav a{color:var(--ink);text-decoration:none;font:600 11px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase}.back{color:var(--muted);letter-spacing:.08em!important}.wrap{max-width:var(--max);margin:auto;padding:64px 28px 90px}.eyebrow,.step-label{font:600 11px/1 DM Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6a857d}.eyebrow{color:#7c5b00;margin-bottom:22px}.progress{height:4px;background:#c9d9ce;margin:34px 0 13px;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:25%;background:var(--sun);transition:width .35s ease}.progress-copy{display:flex;justify-content:space-between;font:11px DM Mono,monospace;color:var(--muted)}h1{font:600 clamp(2.3rem,7vw,4.4rem)/1.04 Lora,serif;letter-spacing:-.045em;margin:0 0 20px}h2{font:600 clamp(1.8rem,5vw,2.7rem)/1.12 Lora,serif;letter-spacing:-.035em;margin:0 0 12px}.intro{font:18px/1.65 Lora,serif;color:var(--muted);max-width:630px}.commitment{margin:33px 0;padding:18px 21px;border-left:3px solid var(--sun);background:#eef5ef;color:var(--ink)}form{margin-top:42px}.field{margin:0 0 22px}.field label{display:block;font-weight:700;margin:0 0 8px}.hint{display:block;color:var(--muted);font-size:13px;margin:-3px 0 9px}input,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.55);padding:15px 16px;border-radius:7px;color:var(--ink);font:inherit;outline:none}textarea{min-height:124px;resize:vertical}input:focus,textarea:focus{border-color:#6d927f;box-shadow:0 0 0 3px rgba(250,183,0,.18)}.choices{display:grid;gap:10px}.choice{position:relative;display:block;border:1px solid var(--line);background:rgba(255,255,255,.42);border-radius:8px;padding:15px 48px 15px 16px;cursor:pointer;transition:.18s}.choice input{position:absolute;opacity:0;pointer-events:none}.choice:has(input:checked){border-color:#668e78;background:#e6f1e8;box-shadow:inset 0 0 0 1px #668e78}.choice:after{content:"";position:absolute;right:17px;top:50%;width:16px;height:16px;border:1px solid #91aca0;border-radius:50%;transform:translateY(-50%)}.choice:has(input:checked):after{background:var(--sun);border:4px solid #fff;box-shadow:0 0 0 1px #c49000}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:38px}.button{border:0;border-radius:7px;padding:15px 22px;background:var(--sun);color:var(--ink);font:700 14px Manrope,sans-serif;cursor:pointer}.button:hover{background:#e9aa00}.secondary{background:transparent;border:0;color:var(--muted);font:600 14px Manrope,sans-serif;cursor:pointer;padding:10px}.saved{font:12px DM Mono,monospace;color:#668e78}.error{color:#a83d2e;font-size:14px;margin-top:12px}.hidden{display:none!important}.note{margin-top:28px;color:var(--muted);font-size:13px}.success{padding:34px;border:1px solid var(--line);background:rgba(244,248,244,.76);border-radius:10px}.success h1{font-size:clamp(2.1rem,6vw,3.6rem)}@media(max-width:560px){.wrap{padding-top:45px}.actions{margin-top:28px}.commitment{margin:25px 0}}
  </style>
</head>
<body><nav><a href="index.html">Jan Trautwein</a><a class="back" href="contact.html">Contact</a></nav><main class="wrap"><div id="application"></div></main>
<script>
const API='https://journey.jantrautwein.com/api/coaching-applications';
const KEY='jan.coaching.application.v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"step":0,"answers":{}}');
const steps=[
 {label:'Start here',title:'Let’s see whether we might be a good fit.',intro:'This is a short application for people who are interested in working with me. It helps me understand what you need before we decide whether a conversation makes sense.',fields:[['name','Your name','text',true],['email','Your email','email',true]],note:'Your details are saved as soon as you continue.'},
 {label:'Your focus',title:'What would you like help with?',intro:'Choose the area that feels most alive right now.',fields:[['focus','', 'choice',true,['Getting clear on my direction and priorities','Building or growing a business','Following through on what matters','Navigating a transition or important decision','Creating a more sustainable way of working','Something else']],['outcome','If this work went well, what would be different three months from now?','textarea',true],['obstacle','What is getting in the way?','textarea',true]]},
 {label:'Your context',title:'Tell me a little about where you are.',intro:'I will only ask business questions if they apply to you.',fields:[['business','Do you currently run a business?','choice',true,['Yes','I am building one','No']],['business_detail','What do you sell, who is it for, and what do you charge?','textarea',false],['revenue','What is your average monthly revenue across the last three months?','choice',false,['Pre revenue','Under $5,000','$5,000 to $15,000','$15,000 to $50,000','$50,000 to $150,000','$150,000 or more']],['capacity','How many additional clients or customers could you realistically take on each month?','text',false]]},
 {label:'Readiness',title:'A final practical question.',intro:'Coaching engagements start at $3,000. Everyone is welcome to submit their interest.',fields:[['timing','When would you like to start?','choice',true,['As soon as we find a fit','Within the next month','Within the next three months','I am exploring for later']],['investment','If we both feel it is a fit, which best describes your situation?','choice',true,['I can comfortably make this investment','I could make this investment with a payment plan','I need more clarity before deciding','This investment is outside my current budget']],['why_now','Why is now the right time to seek support?','textarea',true],['link','Website or LinkedIn profile, if useful','text',false]]}
];
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function businessVisible(id){return !['business_detail','revenue','capacity'].includes(id)||state.answers.business==='Yes'||state.answers.business==='I am building one'}
function field(f){let [id,label,type,required,options]=f;if(!businessVisible(id))return '';let value=state.answers[id]||'';let body='';if(type==='choice')body='<div class="choices">'+options.map(x=>'<label class="choice"><input type="radio" name="'+id+'" value="'+esc(x)+'" '+(value===x?'checked':'')+'>'+esc(x)+'</label>').join('')+'</div>';else if(type==='textarea')body='<textarea name="'+id+'" '+(required?'required':'')+'>'+esc(value)+'</textarea>';else body='<input name="'+id+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'>';return '<div class="field" data-field="'+id+'"><label>'+esc(label)+'</label>'+body+'</div>'}
function render(){let s=steps[state.step],last=state.step===steps.length-1;let inner='<div class="eyebrow">Coaching application</div><div class="progress"><i style="width:'+((state.step+1)/steps.length*100)+'%"></i></div><div class="progress-copy"><span>'+s.label+'</span><span>'+ (state.step+1)+' of '+steps.length+'</span></div><form id="form"><h2>'+s.title+'</h2><p class="intro">'+s.intro+'</p>'+(state.step===0?'<div class="commitment">Coaching engagements start at <strong>$3,000</strong>.</div>':'')+s.fields.map(field).join('')+'<div class="actions"><button class="secondary '+(state.step?'':'hidden')+'" type="button" id="back">Back</button><span class="saved" id="saved">'+(state.step?'Saved as you go':'')+'</span><button class="button" type="submit">'+(last?'Send my application':'Continue')+'</button></div><p id="error" class="error hidden"></p></form><p class="note">Your responses are private and are used only to review your application and follow up with you.</p>';document.querySelector('#application').innerHTML=inner;document.querySelector('#form').onchange=handleChange;document.querySelector('#form').onsubmit=next;let back=document.querySelector('#back');if(back)back.onclick=()=>{state.step--;render()}}
function handleChange(e){state.answers[e.target.name]=e.target.value;if(e.target.name==='business')render()}
async function save(final=false){localStorage.setItem(KEY,JSON.stringify(state));let body={id:state.id||null,step:state.step,answers:state.answers,completed:final};try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error();let data=await r.json();state.id=data.id;localStorage.setItem(KEY,JSON.stringify(state));if(final){let email=new FormData();email.append('access_key','a077514e-a332-4b1d-aa27-c6aaafed462a');email.append('subject','New coaching application from '+state.answers.name);email.append('from_name','jantrautwein.com coaching application');for(let [key,value] of Object.entries(state.answers))email.append(key,value);fetch('https://api.web3forms.com/submit',{method:'POST',body:email,headers:{'Accept':'application/json'}}).catch(()=>{});}return true}catch(e){return false}}
async function next(e){e.preventDefault();let form=e.currentTarget;if(!form.reportValidity())return;let ok=await save(state.step===steps.length-1);if(!ok){let er=document.querySelector('#error');er.textContent='Your answers are safely kept on this device. Please try again in a moment.';er.classList.remove('hidden');return}if(state.step===steps.length-1){localStorage.removeItem(KEY);document.querySelector('#application').innerHTML='<section class="success"><div class="eyebrow">Application received</div><h1>Thank you.</h1><p class="intro">I have your application and will read it personally. If it looks like there is a strong fit, I will be in touch by email.</p><p><a href="index.html">Return to the website</a></p></section>';return}state.step++;render()}
render();
</script></body></html>
